<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ZIP Exif Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/exifreader@4/dist/exif-reader.min.js"></script>
  
  <style>
    /* 基本スタイル */
    body {
      font-family: 'Noto Sans JP', 'Noto Sans', sans-serif, "游ゴシック Medium", "游ゴシック体", "Yu Gothic Medium", YuGothic, "ヒラギノ角ゴ ProN", "Hiragino Kaku Gothic ProN", "メイリオ", Meiryo, "ＭＳ Ｐゴシック", "MS PGothic";

    }
    .header-area h2 { margin: 0; font-size: 18px; }
    .sheet-link { font-size: 13px; font-weight: bold; color: #007bff; text-decoration: none; }
    .sheet-link:hover { text-decoration: underline; }
    
    .drop-zone {

    }
    .drop-zone.hover { border-color: #007bff; background-color: #e9f2ff; }
    #selectedFileName { margin-bottom: 12px; font-weight: bold; font-size: 13px; word-break: break-all; }

    .controls { 
      margin-bottom: 12px; 
      display: flex; 
      gap: 8px; 
      flex-wrap: wrap;
    }
    button {
      font-family: 'Noto Sans JP', sans-serif; 
      padding: 10px 16px; 
      font-weight: bold; 
      font-size: 13px;
      cursor: pointer; 
      border: none; 
      border-radius: 4px; 
      flex: 1 1 auto;
      text-align: center;
    }
    #btnRun { background-color: #28a745; color: white; }
    #btnDryRun { background-color: #17a2b8; color: white; }
    #btnCancel { background-color: #dc3545; color: white; }
    #btnClearLog { background-color: #6c757d; color: white; }
    button:disabled { background-color: #ccc !important; cursor: not-allowed; }
    
    /* ■ 通常画面時 (16pxフォント / 画面に収まるちょうど良い高さ) */
    textarea { 
      font-family: 'Inconsolata', monospace, Consolas, 'Courier New', Courier, Monaco;
      width: 100%; 
      height: 36em; 
      font-size: 16px; 
      line-height: 1.4;
      box-sizing: border-box; 
      background: #1e1e1e; 
      color: #00ff00; 
      padding: 10px; 
      border-radius: 4px; 
      resize: vertical; 
      white-space: pre;
    }

    /* ■ サイドバー表示時 (幅 400px 以下) */
    @media (max-width: 400px) {
      body { margin: 8px; }

        display: grid; 
        grid-template-columns: 1fr 1fr; 
        gap: 6px; 
      }
      button { padding: 8px 4px; font-size: 12px; }
      
      /* サイドバーの高さ制限内にしっかり収まるサイズ */
      textarea { 
        height: 60em; 
        font-size: 12px; 
        padding: 8px;
      }
    }
  </style>

  <script>
    const CHUNK_SIZE = 500;
    const MAX_LOG_COUNT = 1000;

    let selectedFile = null;
    let isProcessing = false;
    let isCanceling = false;
    let logBuffer = [];

    let dropZone = null;
    let fileInput = null;
    let selectedFileName = null;
    let btnRun = null;
    let btnDryRun = null;
    let btnCancel = null;
    let btnClearLog = null;
    let logArea = null;

    /**
     * formatDate.
     * @param d {Date}
     * @param includeMs {boolean}
     */
    function formatDate(d, includeMs = false) {
      if (!d || isNaN(d.getTime())) return '';
      const pad = function(n, len) {
        return String(n).padStart(len, '0');
      };
      const YYYY = d.getFullYear();
      const MM = pad(d.getMonth() + 1, 2);
      const DD = pad(d.getDate(), 2);
      const hh = pad(d.getHours(), 2);
      const mm = pad(d.getMinutes(), 2);
      const ss = pad(d.getSeconds(), 2);
      if (includeMs) {
        const FFF = pad(d.getMilliseconds(), 3);
        return `[${YYYY}/${MM}/${DD} ${hh}:${mm}:${ss}.${FFF}]`;
      } else {
        return `${YYYY}/${MM}/${DD} ${hh}:${mm}:${ss}`;
      }
    }

    /**
     * appendLog.
     * @param message {string}
     */
    function appendLog(message) {
      const timestamp = formatDate(new Date(), true);
      logBuffer.unshift(`${timestamp} ${message}`);
      if (logBuffer.length > MAX_LOG_COUNT) {
        logBuffer.pop();
      }
      if (logArea) {
        logArea.value = logBuffer.join('\n');
      }
    }

    /**
     * clearLog.
     */
    function clearLog() {
      logBuffer = [];
      if (logArea) {
        logArea.value = '';
      }
    }

    /**
     * handleFiles.
     * @param files {File}
     */
    function handleFiles(files) {
      if (files.length > 0 && files[0].name.toLowerCase().endsWith('.zip')) {
        selectedFile = files[0];
        selectedFileName.innerText = `選択ファイル: ${selectedFile.name} (${(selectedFile.size / (1024 * 1024)).toFixed(2)} MB)`;
        appendLog(`ファイルを選択しました: ${selectedFile.name}`);
      } else {
        alert('有効なZIPファイルを選択してください。');
      }
    }

    /**
     * setUIState.
     * @param processing {boolean}
     */
    function setUIState(processing) {
      isProcessing = processing;
      btnRun.disabled = processing;
      btnDryRun.disabled = processing;
      btnCancel.disabled = !processing;
    }

    /**
     * startProcess.
     * @param isDryRun {boolean}
     * @return {Promise}
     */
    async function startProcess(isDryRun) {
      if (selectedFile) {
        setUIState(true);
        isCanceling = false;

        const startTimeDate = new Date();
        const startTimeStr = formatDate(startTimeDate, false);
        const startTime = performance.now();

        const metaData = {
          startTime: startTimeStr,
          endTime: '',
          tempSheetName: ''
        };

        const modeStr = isDryRun ? 'dry-runモード' : '実行モード';
        appendLog(`===== 走査処理を開始します (${modeStr}) =====`);

        let zipReader = null;
        let sendBuffer = [];
        let fileCount = 0;

        try {
          // ① 一時シートの生成要求 (実行モードのみ)
          if (!isDryRun) {
            appendLog('一時シート作成シグナルを送信中...');
            metaData.tempSheetName = await requestCreateTempSheet(metaData);
            appendLog(`一時シートを作成しました: [${metaData.tempSheetName}]`);
          }

          zipReader = new zip.ZipReader(new zip.BlobReader(selectedFile));
          const entries = await zipReader.getEntries();
          appendLog(`ZIPエントリーを取得しました (全 ${entries.length} 件)`);

          for (const entry of entries) {
            if (isCanceling) {
              appendLog('処理がユーザーによって中止されました。');
              break;
            } else {
              if (entry.directory) {
                continue;
              } else {
                const filePath = entry.filename;
                const modDateStr = formatDate(entry.lastModDate, false);
                const ext = filePath.split('.').pop().toLowerCase();

                let dateOriginal = '';
                let model = '';
                let imageWidth = '';
                let imageHeight = '';

                if (['jpg', 'jpeg'].includes(ext)) {
                  try {
                    const uint8 = await entry.getData(new zip.Uint8ArrayWriter());
                    const tags = ExifReader.load(uint8.buffer);

                    if (tags['DateTimeOriginal']) {
                      dateOriginal = tags['DateTimeOriginal'].description.replace(/^(\d{4}):(\d{2}):(\d{2})/, '$1/$2/$3');
                    }
                    if (tags['Model']) {
                      model = tags['Model'].description.replace(/ /g, '_');
                    }
                    if (tags['Image Width']) {
                      imageWidth = tags['Image Width'].value;
                    }
                    if (tags['Image Height']) {
                      imageHeight = tags['Image Height'].value;
                    }
                  } catch (exifErr) {
                    appendLog(`Exception!!!` + exifErr);
                  }
                }

                const rowData = {
                  rowNo: fileCount + 1,
                  filePath: filePath,
                  exifDateOriginal: dateOriginal,
                  exifModel: model,
                  exifImageWidth: imageWidth,
                  exifImageHeight: imageHeight,
                };
                sendBuffer.push(rowData);

                const imageInfo = `(DateTimeOriginal:${dateOriginal} Width:${imageWidth}, Height:${imageHeight})`;
                appendLog(`[${fileCount + 1}] ${filePath} ${imageInfo}`);

                // ② 一時シートへチャンク送信
                if (sendBuffer.length >= CHUNK_SIZE) {
                  if (!isDryRun) {
                    await sendToGas(metaData, sendBuffer);
                  }
                  appendLog(`--- チャンク送信完了 (${fileCount + 1} 件突破) ---`);
                  sendBuffer = [];
                }
                fileCount++;
              }
            }
          }

          // 残バッファの処理
          if (!isCanceling && sendBuffer.length > 0) {
            if (!isDryRun) {
              await sendToGas(metaData, sendBuffer);
            }
            appendLog(`--- 最終バッファ送信完了 (全 ${fileCount} 件) ---`);
            sendBuffer = [];
          }

          // 処理終了日時の記録
          metaData.endTime = formatDate(new Date(), false);

          // ③ ファイナライズ（ローリング＆リネーム＆幅調整）
          if (!isDryRun && !isCanceling) {
            appendLog('シートのローリングおよびファイナライズ処理を実行中...');
            await requestFinalizeSheet(metaData);
            appendLog('スプレッドシートの置き換えおよびローリングが完了しました。');
          }

        } catch (err) {
          appendLog(`[ERROR] エラーが発生しました: ${err.toString()}`);
        } finally {
          if (zipReader) {
            await zipReader.close();
          }
          const endTime = performance.now();
          const totalTimeSec = ((endTime - startTime) / 1000).toFixed(2);
          appendLog(`===== 走査処理が終了しました (総処理時間: ${totalTimeSec} 秒) =====`);
          setUIState(false);
        }
      } else {
        return alert('ZIPファイルを選択してください。');
      }
    }

    /**
     * ① 一時シート作成シグナル
     * @param metaData {Object}
     * @return {Promise<string>} 生成された一時シート名
     */
    async function requestCreateTempSheet(metaData) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(function(result) {
            if (result.status !== 'success') {
              appendLog(`[WARN] 一時シート作成エラー: ${result.message}`);
              reject(new Error(result.message));
            } else {
              resolve(result.tempSheetName);
            }
          })
          .withFailureHandler(function(error) {
            appendLog(`[ERROR] 一時シート作成通信エラー: ${error.message}`);
            reject(error);
          })
          .createTempSheet({ metaData: metaData });
      });
    }

    /**
     * ② 一時シートへのデータ書き込み
     * @param metaData {Object}
     * @param rows {Array}
     * @return {Promise}
     */
    async function sendToGas(metaData, rows) {
      return new Promise(function(resolve, reject) {
        google.script.run
          .withSuccessHandler(function(result) {
            if (result.status !== 'success') {
              appendLog(`[WARN] GAS書き込みエラー: ${result.message}`);
            }
            resolve(result);
          })
          .withFailureHandler(function(error) {
            appendLog(`[ERROR] 送信通信エラー: ${error.message}`);
            reject(error);
          })
          .writeToTempSheet({ metaData: metaData, rows: rows });
      });
    }

    /**
     * ③ ファイナライズ要求
     * @param metaData {Object}
     * @return {Promise}
     */
    async function requestFinalizeSheet(metaData) {
      return new Promise(function(resolve, reject) {
        google.script.run
          .withSuccessHandler(function(result) {
            if (result.status !== 'success') {
              appendLog(`[WARN] ファイナライズエラー: ${result.message}`);
              reject(new Error(result.message));
            } else {
              resolve(result);
            }
          })
          .withFailureHandler(function(error) {
            appendLog(`[ERROR] ファイナライズ通信エラー: ${error.message}`);
            reject(error);
          })
          .finalizeSheet({ metaData: metaData });
      });
    }

    // onload
    window.addEventListener('DOMContentLoaded', function() {
      dropZone = document.querySelector('#dropZone');
      fileInput = document.querySelector('#fileInput');
      selectedFileName = document.querySelector('#selectedFileName');
      btnRun = document.querySelector('#btnRun');
      btnDryRun = document.querySelector('#btnDryRun');
      btnCancel = document.querySelector('#btnCancel');
      btnClearLog = document.querySelector('#btnClearLog');
      logArea = document.querySelector('#logArea');

      dropZone.addEventListener('click', function() {
        fileInput.click();
      });
      fileInput.addEventListener('change', function(e) {
        handleFiles(e.target.files);
      });
      dropZone.addEventListener('dragover', function(e){
        e.preventDefault();
        dropZone.classList.add('hover');
      });
      dropZone.addEventListener('dragleave', function() {
        dropZone.classList.remove('hover');
      });
      dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('hover');
        handleFiles(e.dataTransfer.files);
      });

      btnRun.addEventListener('click', function() {
        startProcess(false); 
      });
      btnDryRun.addEventListener('click', function() {
        startProcess(true);
      });
      btnCancel.addEventListener('click', function() {
        if (isProcessing) {
          isCanceling = true;
          appendLog('中止要求を受け付けました。処理を停止します...');
        }
      });
      btnClearLog.addEventListener('click', function() {
        clearLog();
      });
    });
  </script>
</head>
<body>

<div class="container">
  <div class="header-area">
    <h2>ZIP Metadata Collector</h2>
    <!-- GASから渡されたスプレッドシートURLを出力 -->
    <a href="<?= spreadsheetUrl ?>" target="_blank" class="sheet-link">📊 スプレッドシートを開く ↗</a>
  </div>
  
  <div id="dropZone" class="drop-zone">
    ここにZIPファイルをドラッグ＆ドロップ、またはクリックして選択
    <input type="file" id="fileInput" accept=".zip" style="display: none;">
  </div>
  <div id="selectedFileName">選択ファイル: なし</div>

  <div class="controls">
    <button id="btnRun">実行</button>
    <button id="btnDryRun">dry-run</button>
    <button id="btnCancel" disabled>中止</button>
    <button id="btnClearLog">ログクリア</button>
  </div>

  <textarea id="logArea" readonly wrap="off"></textarea>
</div>

</body>
